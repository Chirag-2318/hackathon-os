name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hackathon_os
          POSTGRES_USER: hackathon
          POSTGRES_PASSWORD: hackathon
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and test backend
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/hackathon_os?options=-c%20TimeZone=UTC
          SPRING_DATASOURCE_USERNAME: hackathon
          SPRING_DATASOURCE_PASSWORD: hackathon
        run: ./mvnw -B test

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint, typecheck and build
        working-directory: frontend
        run: |
          npm run lint
          npm run build
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test
