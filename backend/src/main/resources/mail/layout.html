<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>{{SUBJECT}}</title>
  <!--[if mso]>
  <style type="text/css">
    body, table, td, a { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif !important; }
  </style>
  <![endif]-->
</head>
<body style="margin:0;padding:0;background-color:#0B0B0C;color:#2C2A26;font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
  <!-- Preheader -->
  <div style="display:none;font-size:1px;color:#0B0B0C;line-height:1px;max-height:0px;max-width:0px;opacity:0;overflow:hidden;mso-hide:all;">
    {{PREHEADER}}
  </div>

  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#0B0B0C;min-width:100%;table-layout:fixed;">
    <tr>
      <td align="center" style="padding:40px 16px 48px 16px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:600px;margin:0 auto;">
          <!-- Wordmark Header -->
          <tr>
            <td align="center" style="padding-bottom:24px;">
              <span style="font-family:Georgia, 'Times New Roman', serif;font-size:20px;font-weight:700;color:#F6F3EC;letter-spacing:0.5px;text-decoration:none;">Hackathon OS</span>
            </td>
          </tr>

          <!-- Main Card Container -->
          <tr>
            <td style="background-color:#F6F3EC;border-radius:16px;padding:36px 32px;box-shadow:0 8px 30px rgba(0,0,0,0.35);">
              {{CONTENT}}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding-top:28px;font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:12px;line-height:18px;color:#8E8980;text-align:center;">
              <p style="margin:0 0 6px 0;">Hackathon OS &middot; Collaborative command center for intense hackathons</p>
              {{FOOTER_EXTRA}}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
