<!-- Boarding Pass Container -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#EFECE3;border-radius:12px;border:1px solid #E2DDD3;margin-bottom:28px;">
  <tr>
    <!-- Left Section -->
    <td valign="top" style="padding:24px 20px 24px 24px;">
      <div style="font-family:'SFMono-Regular', Menlo, Consolas, monospace;font-size:11px;font-weight:700;letter-spacing:1px;color:#8E8980;text-transform:uppercase;margin-bottom:6px;">TEAM INVITATION</div>
      <h1 style="margin:0 0 6px 0;font-family:Georgia, 'Times New Roman', serif;font-size:22px;font-weight:700;color:#0B0B0C;line-height:28px;word-break:break-word;">
        {{ROOM_NAME}}
      </h1>
      <div style="font-family:'SFMono-Regular', Menlo, Consolas, monospace;font-size:13px;color:#6A665E;margin-bottom:10px;">
        from @{{INVITER}}
      </div>
      <div style="font-family:'SFMono-Regular', Menlo, Consolas, monospace;font-size:12px;color:#8E8980;line-height:16px;">
        {{TEMPLATE_NAME}} &middot; {{DURATION}}
      </div>
      <div style="margin-top:10px;font-family:'SFMono-Regular', Menlo, Consolas, monospace;font-size:12px;color:#E8A33D;font-weight:700;">
        {{SEATS_FILLED_TEXT}}
      </div>
    </td>

    <!-- Vertical Dashed Tear Line -->
    <td width="1" style="border-right:2px dashed #D6D0C4;padding:0;"></td>

    <!-- Right Stub -->
    <td width="120" valign="middle" align="center" style="padding:20px 16px;text-align:center;">
      <div style="font-family:'SFMono-Regular', Menlo, Consolas, monospace;font-size:11px;font-weight:700;letter-spacing:1.5px;color:#8E8980;text-transform:uppercase;margin-bottom:8px;">ADMIT ONE</div>
      <div style="font-family:'SFMono-Regular', Menlo, Consolas, monospace;font-size:20px;font-weight:700;color:#0B0B0C;letter-spacing:2px;">
        {{STUB_CODE}}
      </div>
    </td>
  </tr>
</table>

{{NOTE_BLOCK}}

<!-- Action Section -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:28px 0 16px 0;">
  <tr>
    <td align="center">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td align="center" bgcolor="#0B0B0C" style="border-radius:8px;">
            <a href="{{INVITE_URL}}" target="_blank" style="display:inline-block;padding:14px 36px;font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:15px;font-weight:600;color:#F6F3EC;text-decoration:none;border-radius:8px;">
              Take the seat
            </a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
  <tr>
    <td align="center" style="padding-top:10px;font-family:'SFMono-Regular', Menlo, Consolas, monospace;font-size:11px;color:#8E8980;">
      Valid until {{EXPIRY_DATE}}
    </td>
  </tr>
</table>

{{FALLBACK_CODE_BLOCK}}
