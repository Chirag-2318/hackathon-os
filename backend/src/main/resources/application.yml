server:
  port: 8080
  forward-headers-strategy: framework
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 1024
  tomcat:
    threads:
      max: 200
    max-connections: 8192
  servlet:
    session:
      cookie:
        http-only: true
        same-site: ${COOKIE_SAME_SITE:Lax}
        secure: ${COOKIE_SECURE:false}

spring:
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:backend/.env[.properties]"
      - "optional:file:../.env[.properties]"
      - "optional:file:application-local.yml"
      - "optional:file:backend/application-local.yml"
  application:
    name: hackathon-os-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true

  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 14MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            protocols: TLSv1.2
            trust: smtp.gmail.com
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      pool:
        size: 4

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/hackathon_os?options=-c%20TimeZone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:hackathon}
    password: ${SPRING_DATASOURCE_PASSWORD:hackathon}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    clean-disabled: false

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:dummy-github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:dummy-github-client-secret}
            redirect-uri: "${APP_PUBLIC_URL:http://localhost:5173}/login/oauth2/code/{registrationId}"
            scope:
              - read:user
              - user:email
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
            redirect-uri: "${APP_PUBLIC_URL:http://localhost:5173}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  public-url: ${APP_PUBLIC_URL:${APP_FRONTEND_URL:http://localhost:5173}}
  api-public-url: ${API_PUBLIC_URL:${APP_BASE_URL:http://localhost:8080}}
  cookie-domain: ${COOKIE_DOMAIN:}
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
  support-email: ${SUPPORT_EMAIL:}
  client-ip-header: ${CLIENT_IP_HEADER:x-vercel-forwarded-for}
  frontend-url: ${APP_PUBLIC_URL:${APP_FRONTEND_URL:http://localhost:5173}}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  upload-dir: ${APP_UPLOAD_DIR:./uploads}
  encryption-key: ${APP_ENCRYPTION_KEY:}
  user-cap: ${APP_USER_CAP:1000}
  admin-emails: ${ADMIN_EMAILS:}
  max-rooms-per-user: ${APP_MAX_ROOMS_PER_USER:10}
  max-upload-mb-per-user: ${APP_MAX_UPLOAD_MB_PER_USER:50}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${APP_PUBLIC_URL:http://localhost:5173}}
  mail:
    enabled: ${MAIL_ENABLED:false}
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    app-password: ${MAIL_APP_PASSWORD:}
    from-address: ${MAIL_FROM_ADDRESS:${MAIL_USERNAME:}}
    from-name: "${MAIL_FROM_NAME:[brackit]}"
    reply-to: ${MAIL_REPLY_TO:}
    daily-limit: ${MAIL_DAILY_LIMIT:400}
    dry-run: ${MAIL_DRY_RUN:false}
    test-endpoint-enabled: ${APP_MAIL_TEST_ENDPOINT_ENABLED:false}
  github:
    token: ${APP_GITHUB_TOKEN:}
    use-fake: ${APP_GITHUB_USE_FAKE:false}
    link-client-id: ${GITHUB_LINK_CLIENT_ID:}
    link-client-secret: ${GITHUB_LINK_CLIENT_SECRET:}
  canva:
    client-id: ${CANVA_CLIENT_ID:}
    client-secret: ${CANVA_CLIENT_SECRET:}
  ai:
    base-url: ${AI_BASE_URL:${GROQ_BASE_URL:https://api.groq.com/openai/v1}}
    api-key: ${AI_API_KEY:${GROQ_API_KEY:${XAI_API_KEY:}}}
    model-default: ${AI_MODEL_DEFAULT:${GROQ_MODEL:openai/gpt-oss-120b}}
    model-fast: ${AI_MODEL_FAST:${AI_MODEL_DEFAULT:${GROQ_MODEL:openai/gpt-oss-20b}}}
    model-smart: ${AI_MODEL_SMART:${AI_MODEL_DEFAULT:${GROQ_MODEL:openai/gpt-oss-120b}}}
    json-mode-supported: ${AI_JSON_MODE_SUPPORTED:true}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:45}
    max-retries: ${AI_MAX_RETRIES:2}
    max-concurrency: ${AI_MAX_CONCURRENCY:4}
    user-rate-per-minute: ${AI_USER_RATE_PER_MINUTE:10}
    enabled: ${AI_ENABLED:true}
    stt:
      base-url: ${STT_BASE_URL:${AI_BASE_URL:https://api.groq.com/openai/v1}}
      api-key: ${STT_API_KEY:${AI_API_KEY:${GROQ_API_KEY:}}}
      model: ${STT_MODEL:whisper-large-v3}
    # Backward compatibility mappings for legacy references
    groq:
      api-key: ${AI_API_KEY:${GROQ_API_KEY:}}
      base-url: ${AI_BASE_URL:${GROQ_BASE_URL:https://api.groq.com/openai/v1}}
      model: ${AI_MODEL_DEFAULT:${GROQ_MODEL:openai/gpt-oss-120b}}
      vision-model: ${AI_MODEL_DEFAULT:${GROQ_MODEL:openai/gpt-oss-120b}}
      max-tokens: 6000