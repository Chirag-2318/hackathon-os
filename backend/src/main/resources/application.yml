server:
  port: 8080

spring:
  application:
    name: hackathon-os-backend
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/hackathon_os?options=-c%20TimeZone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:hackathon}
    password: ${SPRING_DATASOURCE_PASSWORD:hackathon}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    clean-disabled: false


  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:dummy-github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:dummy-github-client-secret}
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  upload-dir: ${APP_UPLOAD_DIR:./uploads}
  encryption-key: ${APP_ENCRYPTION_KEY:}
  ai:
    openai:
      base-url: ${AI_OPENAI_BASE_URL:https://api.openai.com}
      model: ${AI_OPENAI_MODEL:gpt-4o-mini}
    anthropic:
      base-url: ${AI_ANTHROPIC_BASE_URL:https://api.anthropic.com}
      model: ${AI_ANTHROPIC_MODEL:claude-3-5-haiku-20241022}
    gemini:
      base-url: ${AI_GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      model: ${AI_GEMINI_MODEL:gemini-1.5-flash}