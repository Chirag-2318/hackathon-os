server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

spring:
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"
  application:
    name: hackathon-os-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/hackathon_os?options=-c%20TimeZone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:hackathon}
    password: ${SPRING_DATASOURCE_PASSWORD:hackathon}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    clean-disabled: false

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:dummy-github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:dummy-github-client-secret}
            scope:
              - read:user
              - user:email
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
            scope:
              - openid
              - profile
              - email

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  upload-dir: ${APP_UPLOAD_DIR:./uploads}
  encryption-key: ${APP_ENCRYPTION_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  github:
    token: ${APP_GITHUB_TOKEN:}
    use-fake: ${APP_GITHUB_USE_FAKE:false}
    link-client-id: ${GITHUB_LINK_CLIENT_ID:}
    link-client-secret: ${GITHUB_LINK_CLIENT_SECRET:}
  canva:
    client-id: ${CANVA_CLIENT_ID:}
    client-secret: ${CANVA_CLIENT_SECRET:}
  ai:
    base-url: ${AI_BASE_URL:${GROQ_BASE_URL:https://api.groq.com/openai/v1}}
    api-key: ${AI_API_KEY:${GROQ_API_KEY:${XAI_API_KEY:}}}
    model-default: ${AI_MODEL_DEFAULT:${GROQ_MODEL:openai/gpt-oss-120b}}
    model-fast: ${AI_MODEL_FAST:${AI_MODEL_DEFAULT:${GROQ_MODEL:openai/gpt-oss-20b}}}
    model-smart: ${AI_MODEL_SMART:${AI_MODEL_DEFAULT:${GROQ_MODEL:openai/gpt-oss-120b}}}
    json-mode-supported: ${AI_JSON_MODE_SUPPORTED:true}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:45}
    max-retries: ${AI_MAX_RETRIES:2}
    max-concurrency: ${AI_MAX_CONCURRENCY:4}
    user-rate-per-minute: ${AI_USER_RATE_PER_MINUTE:10}
    enabled: ${AI_ENABLED:true}
    stt:
      base-url: ${STT_BASE_URL:${AI_BASE_URL:https://api.groq.com/openai/v1}}
      api-key: ${STT_API_KEY:${AI_API_KEY:${GROQ_API_KEY:}}}
      model: ${STT_MODEL:whisper-large-v3}
    # Backward compatibility mappings for legacy references
    groq:
      api-key: ${AI_API_KEY:${GROQ_API_KEY:}}
      base-url: ${AI_BASE_URL:${GROQ_BASE_URL:https://api.groq.com/openai/v1}}
      model: ${AI_MODEL_DEFAULT:${GROQ_MODEL:openai/gpt-oss-120b}}
      vision-model: ${AI_MODEL_DEFAULT:${GROQ_MODEL:openai/gpt-oss-120b}}
      max-tokens: 6000

---
spring:
  config:
    activate:
      on-profile: prod
server:
  error:
    include-stacktrace: never
    include-message: always