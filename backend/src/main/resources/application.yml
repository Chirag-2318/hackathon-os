server:
  port: 8080

spring:
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"
  application:
    name: hackathon-os-backend
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/hackathon_os?options=-c%20TimeZone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:hackathon}
    password: ${SPRING_DATASOURCE_PASSWORD:hackathon}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    clean-disabled: false


  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:dummy-github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:dummy-github-client-secret}
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  upload-dir: ${APP_UPLOAD_DIR:./uploads}
  encryption-key: ${APP_ENCRYPTION_KEY:}
  github:
    token: ${APP_GITHUB_TOKEN:}
    use-fake: ${APP_GITHUB_USE_FAKE:false}
    link-client-id: ${GITHUB_LINK_CLIENT_ID:}
    link-client-secret: ${GITHUB_LINK_CLIENT_SECRET:}
  canva:
    client-id: ${CANVA_CLIENT_ID:}
    client-secret: ${CANVA_CLIENT_SECRET:}
  ai:
    groq:
      api-key: ${GROQ_API_KEY:${XAI_API_KEY:}}
      base-url: ${GROQ_BASE_URL:${XAI_BASE_URL:https://api.groq.com/openai/v1}}
      model: ${GROQ_MODEL:${XAI_MODEL:llama-3.3-70b-versatile}}
      vision-model: ${GROQ_VISION_MODEL:${XAI_VISION_MODEL:llama-3.2-11b-vision-preview}}
      max-tokens: ${GROQ_MAX_TOKENS:${XAI_MAX_TOKENS:6000}}
    xai:
      api-key: ${XAI_API_KEY:${GROQ_API_KEY:}}
      base-url: ${XAI_BASE_URL:${GROQ_BASE_URL:https://api.groq.com/openai/v1}}
      model: ${XAI_MODEL:${GROQ_MODEL:llama-3.3-70b-versatile}}
      vision-model: ${XAI_VISION_MODEL:${GROQ_VISION_MODEL:llama-3.2-11b-vision-preview}}
      max-tokens: ${XAI_MAX_TOKENS:${GROQ_MAX_TOKENS:6000}}