# Production Profile Configuration for Render / Cloud Deployment
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: always
  servlet:
    session:
      cookie:
        http-only: true
        same-site: ${COOKIE_SAME_SITE:Lax}
        secure: ${COOKIE_SECURE:true}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # DB_POOL_SIZE must stay below managed Postgres max_connections / app instances (leave headroom for admin & scheduler advisory locks)
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000
      leak-detection-threshold: 30000
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        show_sql: false
        format_sql: false
        default_batch_fetch_size: 50
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
  h2:
    console:
      enabled: false
  devtools:
    restart:
      enabled: false
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            redirect-uri: "${APP_PUBLIC_URL}/login/oauth2/code/{registrationId}"
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "${APP_PUBLIC_URL}/login/oauth2/code/{registrationId}"

logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  events:
    max-streams-per-user: ${SSE_MAX_STREAMS_PER_USER:6}
    bus: ${EVENTS_BUS:local}
  cookie:
    secure: ${COOKIE_SECURE:true}
    same-site: ${COOKIE_SAME_SITE:Lax}
  mail:
    test-endpoint-enabled: false
