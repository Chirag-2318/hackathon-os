<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F5F5F5" id="theme-color-meta" />
    <title>[brackit]</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme") || localStorage.getItem("hackathon-os-theme") || "system";
          var resolved = stored;
          if (stored === "system") {
            resolved = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          var root = document.documentElement;
          root.setAttribute("data-theme", resolved);
          root.classList.remove("light", "dark");
          root.classList.add(resolved);
          var textSize = localStorage.getItem("text_size") || "default";
          root.setAttribute("data-text-size", textSize);
          var meta = document.getElementById("theme-color-meta");
          if (meta) {
            meta.setAttribute("content", resolved === "dark" ? "#0E0E10" : "#F5F5F5");
          }

          // Preload first frame's 1440 AVIF on sign-in route
          var p = window.location.pathname;
          if (p === '/signin' || p === '/login' || p.startsWith('/signin/')) {
            var link = document.createElement('link');
            link.rel = 'preload';
            link.as = 'image';
            link.href = '/signin/signin-01-first-light-1440.avif';
            link.type = 'image/avif';
            document.head.appendChild(link);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
