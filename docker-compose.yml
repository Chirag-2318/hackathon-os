services:
  postgres:
    image: postgres:17-alpine
    container_name: hackathon-os-postgres
    environment:
      POSTGRES_DB: hackathon_os
      POSTGRES_USER: hackathon
      POSTGRES_PASSWORD: hackathon_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackathon -d hackathon_os"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hackathon-os-backend
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hackathon_os}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-hackathon}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-hackathon_secure_password}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hackathon-os-frontend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: hackathon-os-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data: